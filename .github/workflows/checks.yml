name: PRAG lightweight regression checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  evidence-and-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the lightweight Ollama client (no daemon or model)
        run: python -m pip install ollama sqlite-vec
      - name: Validate launcher syntax
        run: bash -n launch.sh
      - name: Run read-only readiness regressions
        run: python -m unittest discover -s scripts -p test_check_ready.py -v
      - name: Run evidence-selection regressions without inference
        run: python -m unittest discover -s scripts -p test_answer_evidence.py -v
      - name: Keep literal option evidence outside semantic top-K
        run: python -m unittest discover -s scripts -p test_retrieve_options.py -v
      - name: Verify explicit documentation import safety and cache handling
        run: python -m unittest discover -s scripts -p test_import_security_docs.py -v
